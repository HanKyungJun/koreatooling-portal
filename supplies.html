<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소모품 구매 요청 — 코리아툴링</title>
<link rel="stylesheet" href="portal.css">
</head>
<body>
<div id="auth-overlay" class="auth-overlay">
  <div class="auth-box">
    <div class="auth-icon">🔒</div>
    <h2>직원 전용</h2>
    <p class="auth-desc">비밀번호를 입력하세요.</p>
    <input id="pass-input" type="password" placeholder="비밀번호">
    <button class="auth-btn" onclick="checkPass()">확인</button>
    <div id="pass-err" class="auth-err"></div>
    <a href="index.html" class="auth-back">← 메인으로 돌아가기</a>
  </div>
</div>
<header>
  <h1>🛒 소모품 구매 요청</h1>
  <a href="index.html" class="back-link">← 메인으로</a>
</header>
<main>
  <div id="form-wrap" class="card">
    <div class="card-title">🛒 소모품 구매 요청</div>
    <div class="card-sub">＊ 표시는 필수 입력 항목입니다.</div>
    <form name="supplies-form" method="POST">
      <input type="hidden" name="form-name" value="supplies-form">

      <div class="row2">
        <div class="field">
          <label>요청자 <span class="req">＊</span></label>
          <input type="text" name="requester" placeholder="이름" required>
        </div>
        <div class="field">
          <label>부서 <span class="req">＊</span></label>
          <select name="department" required>
            <option value="">선택하세요</option>
            <option>생산팀</option>
            <option>품질팀</option>
            <option>관리팀</option>
            <option>기타</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>품목명 <span class="req">＊</span></label>
        <input type="text" name="item_name" placeholder="예) 절삭유, 연마석, 측정기" required>
      </div>
      <div class="row2">
        <div class="field">
          <label>규격 / 사양</label>
          <input type="text" name="item_spec" placeholder="예) 100L, #120">
        </div>
        <div class="field">
          <label>수량 <span class="req">＊</span></label>
          <input type="number" name="quantity" placeholder="개/L/m" min="1" required>
        </div>
      </div>
      <div class="field">
        <label>희망 납기</label>
        <input type="date" name="due_date">
      </div>
      <div class="field">
        <label>용도 / 사유 <span class="req">＊</span></label>
        <textarea name="reason" placeholder="구매가 필요한 이유와 용도를 기재해주세요." required></textarea>
      </div>
      <div class="field">
        <label class="check-item" style="font-size:0.88rem;cursor:pointer;">
          <input type="checkbox" name="urgent" value="Y" style="width:auto;accent-color:#c0392b;">
          &nbsp;긴급 요청 (즉시 처리 필요)
        </label>
      </div>
      <button type="submit" class="submit-btn">제출하기 →</button>
    </form>
  </div>
  <div id="success" style="display:none" class="card">
    <div class="success-box">
      <div class="icon">✅</div>
      <h2>제출이 완료되었습니다</h2>
      <p>구매 요청이 접수되었습니다.<br>확인 후 처리하겠습니다.</p>
      <a href="index.html" class="home-btn">메인으로 돌아가기</a>
    </div>
  </div>
</main>
<footer>© 2026 코리아툴링 | Korea Tooling Co., Ltd.</footer>
<iframe name="hidden-target" style="display:none;"></iframe>
<script src="portal.js"></script>
</body>
</html>

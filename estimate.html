<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적 문의 — 코리아툴링</title>
<link rel="stylesheet" href="portal.css">
</head>
<body>

<header>
  <h1>💰 견적 문의</h1>
  <a href="index.html" class="back-link">← 메인으로</a>
</header>
<main>
  <div id="form-wrap" class="card">
    <div class="card-title">💰 견적 문의</div>
    <div class="card-sub">규격·수량을 알려주시면 담당자가 확인 후 견적을 안내해 드립니다. ＊ 표시는 필수 입력 항목입니다.</div>
    <form name="estimate-form" method="POST">
      <input type="hidden" name="form-name" value="estimate-form">
      <!-- 2026-11-25 스팸 거르기 숨은 칸 — 사람에게는 안 보임, 값이 있으면 GAS 가 저장하지 않음 -->
      <div class="hp-field" aria-hidden="true"><label>이 칸은 비워 두세요 <input type="text" name="hp_check" value="" tabindex="-1" autocomplete="off"></label></div>

      <div class="row2">
        <div class="field">
          <label for="f-category">구분 <span class="req">＊</span></label>
          <select id="f-category" name="category" required>
            <option value="">선택하세요</option>
            <option>재연마</option>
            <option>신품 구매</option>
            <option>기타</option>
          </select>
        </div>
        <div class="field">
          <label for="f-material">재질</label>
          <select id="f-material" name="material">
            <option value="">선택하세요</option>
            <option>초경</option>
            <option>HSS</option>
            <option>SKD</option>
            <option>기타</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>규격 / 수량 <span class="req">＊</span><span class="hint">품종이 여러 개면 행 추가</span></label>
        <div id="spec-rows">
          <div class="spec-row">
            <input type="text" name="spec[]" placeholder="예: Ø10 4날 R0.5" required>
            <input type="number" name="quantity[]" placeholder="수량" min="1" required>
            <button type="button" class="row-del" onclick="removeRow(this)" style="display:none;" aria-label="이 행 삭제">✕</button>
          </div>
        </div>
        <button type="button" class="row-add" onclick="addSpecRow()">+ 규격 추가</button>
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-company">회사명 <span class="req">＊</span></label>
          <input id="f-company" type="text" name="company" placeholder="예) ○○정밀" required>
        </div>
        <div class="field">
          <label for="f-contact">담당자 <span class="req">＊</span></label>
          <input id="f-contact" type="text" name="contact" placeholder="이름" required>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-phone">연락처 <span class="req">＊</span></label>
          <input id="f-phone" type="tel" name="phone" placeholder="010-0000-0000" required>
        </div>
        <div class="field">
          <label for="f-email">이메일</label>
          <input id="f-email" type="email" name="email" placeholder="example@email.com">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-due_date">희망 납기</label>
          <input id="f-due_date" type="text" name="due_date" placeholder="예) 12월 둘째 주 또는 2주 이내">
        </div>
        <div class="field">
          <label for="f-monthly_volume">예상 수량대(월 정기 발주 시)</label>
          <input id="f-monthly_volume" type="text" name="monthly_volume" placeholder="예) 월 200개 정도(선택)">
        </div>
      </div>
      <div class="field">
        <label for="f-notes">참고사항</label>
        <textarea id="f-notes" name="notes" placeholder="도면 스펙, 코팅 여부, 기존 거래 이력 등 참고할 내용을 적어주세요."></textarea>
      </div>
      <div class="field">
        <label>도면 / 사진 첨부 <span class="hint">(선택 · 최대 5MB)</span></label>
        <label class="file-drop" for="attach-input" id="file-drop-zone">
          <span id="file-drop-text">📎 클릭하거나 파일을 드래그하세요<br>
          <span class="hint" style="margin-left:0">JPG · PNG · PDF · DWG · DXF</span></span>
        </label>
        <input type="file" id="attach-input" accept="image/*,.pdf,.dwg,.dxf" style="display:none">
        <button type="button" id="attach-clear" class="attach-clear" style="display:none;">첨부 취소</button>
        <div id="attach-error" class="attach-error" role="alert" style="display:none;"></div>
        <input type="hidden" name="file-data" id="file-data">
        <input type="hidden" name="file-name" id="file-name">
        <input type="hidden" name="file-type" id="file-type">
      </div>
      <button type="submit" class="submit-btn">견적 요청하기 →</button>
    </form>
  </div>
  <div id="success" style="display:none" class="card">
    <div class="success-box">
      <div class="icon">✅</div>
      <h2>견적 요청이 접수되었습니다</h2>
      <p>담당자가 확인 후 견적을 안내해 드리겠습니다.<br>감사합니다.</p>
      <a href="index.html" class="home-btn">메인으로 돌아가기</a>
    </div>
  </div>
</main>
<footer>© 2026 코리아툴링 | Korea Tooling Co., Ltd.</footer>
<iframe name="hidden-target" style="display:none;"></iframe>
<script src="portal.js"></script>
<script>
function addSpecRow() {
  var container = document.getElementById('spec-rows');
  var row = document.createElement('div');
  row.className = 'spec-row';
  row.innerHTML = '<input type="text" name="spec[]" placeholder="예: Ø10 4날 R0.5" required>'
    + '<input type="number" name="quantity[]" placeholder="수량" min="1" required>'
    + '<button type="button" class="row-del" onclick="removeRow(this)" aria-label="이 행 삭제">✕</button>';
  container.appendChild(row);
  updateRemoveButtons();
  row.querySelector('input').focus();
}
function removeRow(btn) {
  btn.closest('.spec-row').remove();
  updateRemoveButtons();
}
function updateRemoveButtons() {
  var rows = document.querySelectorAll('.spec-row');
  document.getElementById('spec-rows').classList.toggle('multi', rows.length > 1);
  rows.forEach(function(r, i) {
    r.querySelector('button').style.display = rows.length > 1 ? '' : 'none';
  });
}
var ATTACH_OK = /\.(jpe?g|png|gif|webp|bmp|pdf|dwg|dxf)$/i;   // 2026-11-25 — 끌어놓기에도 허용 형식 검사
var dropZone    = document.getElementById('file-drop-zone');
var attachInput = document.getElementById('attach-input');
var attachErr   = document.getElementById('attach-error');
var attachClear = document.getElementById('attach-clear');
var dropText    = document.getElementById('file-drop-text');
var dropDefault = dropText.innerHTML;   // 처음 안내 문구(페이지에 고정된 글) — 첨부 취소 때 되돌림
attachInput.addEventListener('change', function(e) {
  handleAttach(e.target.files[0]);
});
dropZone.addEventListener('dragover', function(e) {
  e.preventDefault(); dropZone.style.borderColor = '#1A3A6B';
});
dropZone.addEventListener('dragleave', function() {
  dropZone.style.borderColor = '';
});
dropZone.addEventListener('drop', function(e) {
  e.preventDefault(); dropZone.style.borderColor = '';
  handleAttach(e.dataTransfer.files[0]);
});
// 첨부 칸 밖에 파일을 떨어뜨려도 브라우저가 파일을 열며 페이지를 벗어나지 않게
window.addEventListener('dragover', function(e) { e.preventDefault(); });
window.addEventListener('drop', function(e) { e.preventDefault(); });
attachClear.addEventListener('click', clearAttach);
function attachError(msg) {
  attachErr.textContent = msg || '';
  attachErr.style.display = msg ? 'block' : 'none';
}
function clearAttach() {
  ['file-data', 'file-name', 'file-type'].forEach(function(id) { document.getElementById(id).value = ''; });
  attachInput.value = '';
  dropText.innerHTML = dropDefault;
  dropZone.classList.remove('has-file');
  attachClear.style.display = 'none';
  attachError('');
}
function handleAttach(file) {
  if (!file) return;
  attachError('');
  if (!ATTACH_OK.test(file.name)) {
    attachInput.value = '';
    attachError('JPG · PNG · PDF · DWG · DXF 파일만 첨부할 수 있습니다.');
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    attachInput.value = '';
    attachError('파일 크기는 5MB 이하로 첨부해 주세요.');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('file-data').value = ev.target.result;
    document.getElementById('file-name').value = file.name;
    document.getElementById('file-type').value = file.type;
    // 파일 이름은 글자로만 넣는다(이름에 든 HTML · 스크립트가 실행되지 않게 — 2026-11-25)
    dropText.textContent = '';
    dropText.appendChild(document.createTextNode('✅ ' + file.name));
    dropText.appendChild(document.createElement('br'));
    var sub = document.createElement('span');
    sub.className = 'hint';
    sub.style.marginLeft = '0';
    sub.textContent = (file.size / 1024).toFixed(0) + 'KB · 클릭해서 변경';
    dropText.appendChild(sub);
    dropZone.classList.add('has-file');
    attachClear.style.display = '';
  };
  reader.readAsDataURL(file);
}
</script>
</body>
</html>

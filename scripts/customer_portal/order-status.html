<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>발주·진행 현황 조회 — 코리아툴링</title>
<!-- 워크숍 범위 ③ 시제품 (2026-10-08). 시제품 단계에서는 dist/ 밖에 둔다 — dist/ 에 넣으면 다음 generate.py 실행 때 공개 배포된다.
     데이터는 이 파일에 없다. 접속 코드를 넣으면 Apps Script(scripts/customer_portal_gas.gs)가 그 거래처 행만 돌려준다. -->
<link rel="stylesheet" href="portal.css">
<style>
  /* 2026-10-08: 표가 잘려 화면을 넓힘 — 공용 portal.css 의 main 680px 를 이 화면만 덮어쓴다 */
  main { max-width: 1280px; }
  #os-form, #os-msg { max-width: 560px; }   /* 카드는 결과 표와 같은 폭으로 맞추고, 입력칸만 좁게 */
  table.os th { background:#f4f6f8; position: sticky; top: 0; }
  .os-sum { display:flex; gap:12px; flex-wrap:wrap; margin:12px 0; }
  .os-sum div { background:#f4f6f8; border-radius:8px; padding:10px 14px; min-width:120px; }
  .os-sum b { display:block; font-size:22px; }
  .os-wrap { overflow-x:auto; }
  table.os { border-collapse:collapse; width:100%; font-size:14px; }
  table.os th, table.os td { border-bottom:1px solid #e3e6ea; padding:6px 8px; text-align:left; white-space:nowrap; }
  table.os td.num, table.os th.num { text-align:right; }
  .st-진행중 { color:#b45309; font-weight:600; }
  .st-일부출하 { color:#1d4ed8; font-weight:600; }
  .st-출하완료 { color:#4b5563; }
  .os-msg { margin-top:10px; }
  .os-note { color:#6b7280; font-size:13px; margin-top:8px; }
  #os-code { width:100%; box-sizing:border-box; padding:12px 14px; font-size:16px; letter-spacing:2px;
             border:1px solid #cfd6de; border-radius:8px; }
</style>
</head>
<body>
<header>
  <h1>📦 발주·진행 현황 조회</h1>
  <a href="index.html" class="back-link">← 메인으로</a>
</header>
<main>
  <div class="card" id="os-form-card">
    <div class="card-title">거래처 접속 코드</div>
    <div class="card-sub">코리아툴링에서 안내받은 접속 코드를 입력하세요. 맡기신 재연마 공구의 접수·납기·출하 현황을 보여 드립니다.</div>
    <form id="os-form" autocomplete="off">
      <div class="field">
        <input type="password" id="os-code" placeholder="접속 코드 12자리" maxlength="20" required>
      </div>
      <button type="submit" class="submit-btn">조회하기 →</button>
    </form>
    <div id="os-msg" class="os-msg"></div>
  </div>

  <div class="card" id="os-result" hidden>
    <div class="card-title" id="os-cust"></div>
    <div class="card-sub" id="os-asof"></div>
    <div class="os-sum" id="os-sum"></div>
    <div class="os-wrap"><table class="os" id="os-table"></table></div>
    <div class="os-note">진행 현황은 하루 두 번(오전·오후) 갱신됩니다. 출하 완료 건은 최근 60일분만 표시합니다. 문의는 담당자에게 연락 주세요.</div>
  </div>
</main>
<script>
(function () {
  var GAS_URL = '__CUSTOMER_PORTAL_GAS_URL__';   // generate.py 가 .env 값으로 바꿔 넣는다 — 저장소에는 URL 을 두지 않는다(secret_scan 기준)
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  // 시트가 시각 문자열을 날짜로 바꿔 돌려주는 경우가 있어 화면에서 YYYY-MM-DD HH:mm 으로 맞춘다 (2026-10-08)
  var fmtTs = function (v) {
    if (!v) return '-';
    if (/^\d{4}-\d{2}-\d{2}/.test(String(v))) return String(v).slice(0, 16);
    var d = new Date(v);
    if (isNaN(d)) return String(v);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  };
  var MSG = { denied: '접속 코드가 맞지 않습니다. 다시 확인해 주세요.',
              busy: '잠시 후 다시 시도해 주세요.',
              not_configured: '조회 서비스 준비 중입니다.',
              error: '일시적인 오류입니다. 잠시 후 다시 시도해 주세요.',
              network: '조회 서버에 연결하지 못했습니다. 인터넷 연결을 확인하거나 잠시 후 다시 시도해 주세요.' };

  $('os-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var code = $('os-code').value.trim();
    $('os-msg').textContent = '조회 중…';
    $('os-result').hidden = true;
    fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                     body: JSON.stringify({ action: 'view', code: code }) })
      .then(function (r) {
        return r.text().then(function (t) {
          try { return JSON.parse(t); }
          catch (e) { throw { kind: 'parse', detail: 'HTTP ' + r.status + ' · ' + t.slice(0, 120) }; }
        });
      }, function (e) { throw { kind: 'network', detail: String(e) }; })
      .then(function (d) {
        if (d.status !== 'ok') { $('os-msg').textContent = MSG[d.status] || MSG.error; return; }
        $('os-msg').textContent = '';
        render(d);
      })
      .catch(function (e) {
        // 원인 구분용(2026-10-08): 화면 문구 끝의 [ ] 안 표시로 연결 실패 / 응답 형식 / 기타를 가른다
        var kind = (e && e.kind) || 'other';
        $('os-msg').textContent = (kind === 'network' ? MSG.network : MSG.error) + ' [' + kind + ']';
        if (window.console) console.log('order-status', kind, e && e.detail, location.protocol);
      });
  });

  function render(d) {
    var rows = d.rows || [];
    var open = rows.filter(function (r) { return r.status !== '출하완료'; });
    var rest = open.reduce(function (a, r) { return a + Number(r.rest || 0); }, 0);
    $('os-cust').textContent = (d.customer || '') + ' 진행 현황';
    $('os-asof').textContent = '기준 시각: ' + fmtTs(d.snapshot_kst) + ' (KST)';
    $('os-sum').innerHTML =
      '<div>진행 중 <b>' + open.length + '건</b></div>' +
      '<div>남은 수량 <b>' + rest + '개</b></div>' +
      '<div>최근 출하 완료 <b>' + (rows.length - open.length) + '건</b></div>';
    var h = '<tr><th>상태</th><th>접수일</th><th>납기</th><th>품목</th><th>코팅</th><th>사양</th>' +
            '<th class="num">수량</th><th class="num">출하</th><th class="num">남은 수량</th><th>출하일</th><th>접수번호</th></tr>';
    rows.forEach(function (r) {
      h += '<tr><td class="st-' + esc(r.status) + '">' + esc(r.status) + '</td><td>' + esc(r.so_dt) +
           '</td><td>' + esc(r.dlv_dt) + '</td><td>' + esc(r.itm_nm) + '</td><td>' + esc(r.jae_coating) +
           '</td><td>' + esc(r.jae_angle) + '</td><td class="num">' + esc(r.so_qty) + '</td><td class="num">' +
           esc(r.out_qty) + '</td><td class="num">' + esc(r.rest) + '</td><td>' + esc(r.out_dt) +
           '</td><td>' + esc(r.so_no) + '</td></tr>';
    });
    $('os-table').innerHTML = h;
    $('os-result').hidden = false;
  }
})();
</script>
</body>
</html>

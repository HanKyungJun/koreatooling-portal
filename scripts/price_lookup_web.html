<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>재연마 정가 조회 (시연)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--sub:#5d6675;--line:#dfe3ea;--acc:#1f5fbf;--warn:#b25b00;--bad:#a12a2a;--ok:#1d7a3a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}.lead{color:var(--sub);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:8px}input{flex:1;min-width:0;font-size:17px;padding:12px 14px;border:1px solid #b9c1ce;border-radius:8px;font-family:inherit}
button{font-size:16px;padding:0 18px;white-space:nowrap;flex:none;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer;font-family:inherit}
.chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:14px;background:#fafbfc;cursor:pointer;color:var(--sub)}
.parsed{font-size:13px;color:var(--sub);margin:4px 0 10px}.parsed b{color:var(--ink)}
.note{font-size:13px;color:var(--warn);margin:2px 0}
table{width:100%;border-collapse:collapse;margin-top:6px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:12px;color:var(--sub);font-weight:600}td.p{text-align:right;font-weight:700;font-size:16px;white-space:nowrap}
.st-ok{color:var(--ok)}.st-chk{color:var(--warn)}.st-no{color:var(--bad)}.src{font-size:12px;color:var(--sub)}
.ask{font-size:16px;color:var(--warn)}.foot{font-size:12px;color:var(--sub);line-height:1.6}
@media (max-width:560px){td,th{font-size:12px;padding:7px 4px}td.p{font-size:14px}}
</style></head><body><div class="wrap">
<h1>재연마 정가 조회 <span style="font-size:13px;color:#8a93a3">· 사내 시연판</span></h1>
<p class="lead">공구를 말하듯 입력하면 정가표 기준 <b>정가</b>를 알려 드립니다. 실제 청구 금액은 거래처별 할인이 적용되며 담당자가 확인합니다.</p>
<div class="card">
 <div class="row"><input id="q" placeholder="예) 10파이 2날 볼 고경도   ·   D6 4날 평 밑옆날 일반코팅" autofocus><button id="go">조회</button></div>
 <div class="chips" id="chips"></div>
</div>
<div class="card" id="out" style="display:none"></div>
<div class="foot" id="foot"></div>
</div>
<script>window.PRICE_DATA=/*__DATA__*/null;</script>
<script>/*__CORE__*/</script>
<script>
const DATA=window.PRICE_DATA;const {answer,parseQuery,COAT_LABEL,g}=window.PriceLookup;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(res){const o=document.getElementById('out');o.style.display='block';const q=res.q;
 const lab={blade:'날수',shape:'형상',dia:'직경',mat:'재질',part:'가공부',coat:'코팅'};
 let h=`<div class="parsed">해석: ${Object.keys(lab).map(k=>`${lab[k]} <b>${q[k]==null?'—':(k==='dia'?'Ø'+g(q[k])+' mm':k==='blade'?q[k]+'날':k==='coat'?COAT_LABEL[q[k]]:q[k])}</b>`).join(' · ')}</div>`;
 if(q.missing.length){h+=`<div class="ask">❓ ${q.missing.map(m=>({shape:'형상(평 / 볼 / 코너 / 라핑 / 드릴 …)',dia:'직경(mm)'}[m])).join(', ')}을(를) 함께 입력해 주세요.</div>`;o.innerHTML=h;return}
 for(const a of q.assumed)h+=`<div class="note">※ ${esc(a)}</div>`;
 h+='<table><tr><th>품목</th><th style="text-align:right">정가</th><th>상태 · 근거</th></tr>';
 for(const r of res.rows){const cls=r.status==='OK'?'st-ok':r.status==='없음'?'st-no':'st-chk';
  h+=`<tr><td>${esc(r.name)}</td><td class="p">${r.price!=null?Number(r.price).toLocaleString('ko-KR')+'원':'-'}</td><td><span class="${cls}">${r.status==='OK'?'✔':r.status==='없음'?'❓ 없음':'⚠ 확인 필요'}</span> <span class="src">${esc(r.src)}</span></td></tr>`}
 o.innerHTML=h+'</table>'}
function run(){const v=document.getElementById('q').value.trim();if(v)render(answer(v))}
document.getElementById('go').onclick=run;document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
const EX=['10파이 2날 볼 고경도','D6 4날 평 밑옆날 일반코팅','하이스 라핑 볼 16mm 두날 코팅','드릴 6.8 HSS 비코팅 2날','3날 평 10mm','ø8 코너 R0.5 2F 비코팅'];
document.getElementById('chips').innerHTML=EX.map(e=>`<span class="chip">${esc(e)}</span>`).join('');
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.getElementById('q').value=c.textContent;run()});
document.getElementById('foot').innerHTML=`기준: ${esc(DATA.pricelist)} 「${esc(DATA.sheet)}」 · 등록 정가 ${esc(DATA.master_src||'')} · 데이터 생성 ${esc(DATA.made)}<br>정가만 표시합니다(할인율·거래처 단가 없음). 「확인 필요」·「없음」은 담당자가 확인합니다. 사내 시연용 — 외부 배포 전 대표님 확인 필요.`;
</script></body></html>
